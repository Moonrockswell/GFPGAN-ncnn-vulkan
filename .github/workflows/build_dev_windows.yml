# CI code is based on
# https://github.com/nihui/realsr-ncnn-vulkan/blob/master/.github/workflows/release.yml
# Modified in here for newer vulkan
# https://github.com/onuralpszr/realsr-ncnn-vulkan/blob/vulkan-ci-version/.github/workflows/CI.yml


name: Windows Dev Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  APPLICATION_NAME: gfpgan-ncnn-vulkan


jobs:
  dev-build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: cache-vulkansdk
      id: cache-vulkansdk
      uses: actions/cache@v5
      with:
        path: "VulkanSDK"
        key: VulkanSDK-${{ vars.VULKAN_SDK_VERSION }}-Installer
    - name: cache-opencv
      id: cache-opencv
      uses: actions/cache@v5
      with:
        path: "OpenCV"
        key: opencv-${{ vars.OPENCV_VERSION }}-windows
    - name: vulkansdk
      if: steps.cache-vulkansdk.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/${{ vars.VULKAN_SDK_VERSION }}/windows/vulkan_sdk.exe?Human=true -OutFile VulkanSDK-${{ vars.VULKAN_SDK_VERSION }}-Installer.exe
        .\VulkanSDK-${{ vars.VULKAN_SDK_VERSION }}-Installer.exe --root "$(pwd)\VulkanSDK" --accept-licenses --default-answer --confirm-command install
    - name: install opencv
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri https://github.com/opencv/opencv/releases/download/${{ vars.OPENCV_VERSION }}/opencv-${{ vars.OPENCV_VERSION }}-windows.exe -OutFile opencv-${{ vars.OPENCV_VERSION }}-windows.exe
        7z x -aoa ./opencv-${{ vars.OPENCV_VERSION }}-windows.exe -oOpenCV
    - name: build
      run: |
        $env:OpenCV_DIR="$(pwd)/OpenCV/opencv/build"
        $env:VULKAN_SDK="$(pwd)/VulkanSDK"
        mkdir build; cd build
        cmake -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" ../src
        cmake --build . --config Release -j 2
    - name: find exe
      run: |
        Get-ChildItem -Path build -Recurse -Filter *.exe        
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APPLICATION_NAME }}-windows
        path: build/*/Release/
